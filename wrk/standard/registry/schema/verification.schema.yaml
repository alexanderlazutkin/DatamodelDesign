# Схема записи результата проверки соответствия (С01 прил. А, 10.1; ПВ-03, Д2)
# Хранится отдельно от требования: требование определяет, КАК проверять;
# запись результата — ЧТО установлено для конкретной модели.
# Свидетельства (прил. Г) — отдельный объект: запись ссылается на них, не заменяя.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://std.local/registry/verification-1.schema.yaml
title: Запись результата проверки соответствия
type: object
additionalProperties: false
required: [schema_version, record, id, requirement, standard_release, procedure, scope, object, result, checked_by]
properties:
  schema_version:
    const: 1
  record:
    const: verification
  id:
    type: string
    pattern: '^V-[0-9]{6}$'
  requirement:
    type: object
    additionalProperties: false
    required: [id, revision]
    properties:
      id: {type: string, pattern: '^(GEN|CDM|LDM)-[0-9]{3,4}$'}
      revision: {type: integer, minimum: 1}
  standard_release:
    # проверенный набор требований (манифест)
    type: string
    minLength: 1
  procedure:
    # контрольная процедура и её версия (прил. Ж)
    type: object
    additionalProperties: false
    required: [id, version]
    properties:
      id: {type: string, pattern: '^PR-[0-9]{3,4}$'}
      version: {type: integer, minimum: 1}
  scope:
    enum: [model, fragment]
  object:
    # проверяемый объект: версия модели либо фрагмент; тестовые копии —
    # из пространства имён тестовых артефактов (С01 4.6)
    type: object
    additionalProperties: false
    required: [model]
    properties:
      model: {type: string, minLength: 1}
      version: {type: integer, minimum: 1}
  result:
    # not_checked — ни выполнение, ни допустимое исключение;
    # insufficient — недостаточно сведений, требует доопределения (прил. А)
    enum: [verified, failed, not_applicable, not_checked, insufficient]
  evidence:
    # ссылки на конкретные свидетельства (прил. Г)
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^EV-[0-9]{4}$'}
    default: []
  checked_by:
    type: object
    additionalProperties: false
    required: [initiator, executor, date]
    properties:
      initiator: {type: string, minLength: 1}
      executor: {type: string, minLength: 1}
      date: {type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
  exception:
    # исключение (С01 3.8) при наличии
    oneOf:
      - type: 'null'
      - type: string
        minLength: 1
    default: null
