# Схема манифеста выпуска стандарта (С01 прил. А; ПВ-03, Д2)
# Манифест утверждает согласованный набор требований и сопутствующих материалов,
# а не текущее состояние реестра; редакция требования может входить в несколько
# последовательных выпусков. Манифест фиксирует версии ВСЕХ компонентов, влияющих
# на содержание, применимость, проверку и согласование требований данного выпуска,
# включая версию схемы реестра, — для воспроизводимости проверки во времени.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://std.local/registry/standard-release-1.schema.yaml
title: Манифест выпуска стандарта
type: object
additionalProperties: false
required: [schema_version, record, release, date, status, includes]
properties:
  schema_version:
    const: 1
  record:
    const: standard_release
  release:
    type: string
    pattern: '^[0-9]+\.[0-9]+(-д[0-9]+(\.[0-9]+)?)?$'
  date:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  status:
    enum: [draft, approved]
  includes:
    type: object
    additionalProperties: false
    required: [requirements, components]
    properties:
      requirements:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [id, revision]
          properties:
            id: {type: string, pattern: '^(GEN|CDM|LDM)-[0-9]{3,4}$'}
            revision: {type: integer, minimum: 1}
      components:
        # все компоненты, влияющие на выпуск; перечень универсален (прил. А)
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [ref, version]
          properties:
            ref:
              # schema — версия схемы реестра; прочие — приложения и глоссарий
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
