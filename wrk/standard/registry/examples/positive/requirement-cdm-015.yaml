# Испытательный пример схемы (Д2, ПВ-03): норма с допустимой неизвестностью.
# Формулировка по образцу С01 3.10 из Пробы переноса 3.3 — выполнима и при
# неизвестной кардинальности: предметный факт отделён от обязанности документирования.
schema_version: 1
id: CDM-015
revision: 1
formulation: >-
  Зафиксировать для каждой связи минимальное и максимальное участие с обеих
  сторон; неустановленные ограничения обозначить явно; различать установленные
  правила, фактическую практику и наблюдения в данных.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждая связь охвата имеет обе кардинальности либо явную маркировку
    неустановленности с основанием; категории «правило», «практика»,
    «наблюдение в данных» не смешиваются.
  procedure: null
  evidence: [диаграммы, карточки связей, реестр вопросов]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3 (CDM-015)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
