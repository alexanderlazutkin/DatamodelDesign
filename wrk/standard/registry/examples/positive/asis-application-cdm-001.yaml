# Испытательный пример схемы (Д2, ПВ-03): матрица применения, unchanged/applies_as_is.
# Обязательство одинаково в обоих режимах; критерий проверки в AS-IS расширен
# реквизитами обследования (С02 2.1.1, описание AS-IS) без изменения обязательства.
schema_version: 1
record: asis_application
standard_release: "0.2"
requirement: {id: CDM-001, revision: 1}
way: unchanged
relation_type: applies_as_is
as_is_criterion: >-
  Паспорт содержит все реквизиты TO-BE и дополнительно: источники, период
  обследования, дату актуальности, объём текущего этапа; для системных
  источников — версии или окружения, если они влияют на трактовку.
