# Испытательный пример схемы (Д2, ПВ-03): двух-ID случай по режимам (Проба 3.3).
# TO-BE-ветка: устранение неопределённостей к утверждению либо исключение.
schema_version: 1
id: LDM-031
revision: 1
formulation: >-
  Устранить неопределённости, влияющие на реализацию проектируемой части модели,
  к моменту утверждения либо оформить согласованные исключения.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be]
  stage: [6]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    К моменту утверждения отсутствуют неустранённые неопределённости реализации
    без оформленных исключений (основание, влияние, ответственный, согласовывающий,
    условия пересмотра).
  procedure: null
  evidence: [реестр вопросов, записи исключений]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "2.5 (LDM-031)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
