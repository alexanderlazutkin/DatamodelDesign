# Испытательный пример схемы (Д2, ПВ-03): матрица применения, adapted/adapts_for_mode.
# Различающиеся обязательства по режимам (Проба 3.3): ссылка на адаптированное
# AS-IS-требование обязательна; ID LDM-039 — условный (см. requirement-ldm-039-adapted.yaml).
schema_version: 1
record: asis_application
standard_release: "0.2"
requirement: {id: LDM-031, revision: 1}
way: adapted
relation_type: adapts_for_mode
linked: {id: LDM-039, revision: 1}
rationale: >-
  Различие обязательств: в AS-IS нет обязанности устранения неопределённостей
  к утверждению (документирование не требует исправления системы — С03 п. 1.1);
  установлена обязанность маркировки источника и статуса восстановленной семантики.
as_is_criterion: >-
  Для восстановленной семантики и спорных правил указаны источник и статус
  (подтверждено, предположение, не установлено); схемное ограничение, правило
  приложения и наблюдения в данных различаются.
