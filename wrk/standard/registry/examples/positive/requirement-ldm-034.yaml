# Испытательный пример схемы (Д2, ПВ-03): условная норма.
# Условная применимость к необязательным конструкциям — в conditions (С02 п. 1.5;
# Проба переноса, прим. 2 к Б5), не в модальность.
schema_version: 1
id: LDM-034
revision: 1
formulation: >-
  Определить критерии принадлежности к подтипам, возможность пересечения,
  полноту классификации и наследование идентификаторов. Для иерархий —
  допустимость нескольких родителей, корней и циклов в данных.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в модели имеются подтипы (обобщения) либо рекурсивные или иерархические структуры
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Для каждого обобщения указаны критерий принадлежности подтипов,
    пересекаемость, полнота классификации и наследование идентификаторов;
    для каждой иерархии — допустимость нескольких родителей, корни и циклы.
  procedure: null
  evidence: [карточки сущностей, диаграммы]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "2.2 (LDM-034)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
