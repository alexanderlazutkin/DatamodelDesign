# Перенос (волна 3 Д7, Р-023): С03, 2.5; размещение — 4.1 (рядом с CDM-038); этапы по Б2 (6, доп. 7).
schema_version: 1
id: LDM-035
revision: 1
formulation: >-
  Определить ответственных за ЛМД, бизнес-семантику и техническую проверку; установить порядок утверждения модели соответствующего охвата. Устанавливается порядок поэтапной проверки техническими экспертами и представителями бизнеса; техническая приёмка инвентаризации не объявляет всю семантику согласованной.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [6, 7]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Роли и ответственные определены (прил. К); порядок поэтапной проверки и утверждения установлен.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
