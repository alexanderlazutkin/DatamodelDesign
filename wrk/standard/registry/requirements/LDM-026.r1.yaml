# Перенос (Д3, Р-016): С03, этап 4 (LDM-026). ИОД включено в объём пилота
# (Р-010 по ПВ-08). Атрибутивная разметка ЛМД; понятийная — CDM-032.
schema_version: 1
id: LDM-026
revision: 1
formulation: >-
  Указывать применимую категорию (разметку) данных со ссылкой на корпоративную
  классификацию; детальные права доступа в ЛМД не переносятся. В документации
  используются синтетические либо обезличенные примеры вместо реальных
  чувствительных значений.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в охват модели входят данные, подпадающие под корпоративную или нормативную классификацию ИОД
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Атрибуты и сущности с чувствительными данными имеют разметку со ссылкой
    на классификацию; детальные права доступа в модель не перенесены;
    чувствительные значения в документации заменены синтетическими либо
    обезличенными.
  procedure: null
  evidence: [разметка ИОД модели, ссылка на классификацию]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 4 (LDM-026)"}
based_on: []
relations:
  depends_on:
    - CDM-032
  refines: []
  replaces: null
status: approved
