# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-004
revision: 1
formulation: >-
  Включить все сущности и атрибуты, необходимые для реализации требований в согласованных границах модели; исключения и внешние объекты обозначаются явно. Производные атрибуты включаются при наличии бизнес-значимости; отображение всех вычислений приложения не требуется. Допускается последовательное описание по подсистемам, процессам или приоритетам; неописанные и нерасшифрованные объекты учитываются отдельно; частичная модель не обозначается как полная.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Все сущности и атрибуты согласованного охвата включены либо явно исключены; неописанные объекты учтены отдельно; частичная модель не предъявляется как полная.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
