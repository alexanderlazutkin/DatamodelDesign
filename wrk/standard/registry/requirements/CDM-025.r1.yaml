# Перенос (волна 2 Д7, Р-022): С02, 2.4.4.
schema_version: 1
id: CDM-025
revision: 1
formulation: >-
  Зафиксировать существенные бизнес-правила согласованного охвата: уникальность в бизнес-контексте, несовместимость ролей, условия участия и другие ограничения допустимых экземпляров, их сочетаний и связей. Выявленные правила документируются с источниками, статусом и контекстом действия; известные нарушения учитываются отдельно; механизмы реализации не требуются.
