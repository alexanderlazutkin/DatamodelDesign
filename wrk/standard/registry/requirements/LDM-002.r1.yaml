  kind: documentary
  criterion: >-
    Правила логического именования согласованы и применяются; логические
    наименования отделены от физических имён; отклонения зафиксированы.
  procedure: null
  evidence: [словарь сущностей и атрибутов, правила именования]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 2 (LDM-002)"}
based_on: []
