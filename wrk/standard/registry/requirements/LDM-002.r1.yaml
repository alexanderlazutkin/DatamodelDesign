# Перенос (Д3, Р-016): С03, этап 2 (LDM-002). Требование к документации
# не превращается в требование изменить схему БД (комментарий исходника).
# Основа случая § 7.2 «недостатки именования в существующей реализации».
schema_version: 1
id: LDM-002
revision: 1
formulation: >-
  Соблюдать согласованные правила логического именования: язык, сокращения,
  использование бизнес-терминов; логические наименования отделяются от
  физических имён объектов.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
