# Выделение нормы из практики применения (Д7-остатки полного выпуска,
# Р-028): раздел 7.11 Стандарта 0.6. Обязательства — все профили
# (ПВ-02, Р-010); условная применимость — в conditions.
# Новая запись — draft до рецензирования контуром R.
schema_version: 1
id: LDM-040
revision: 1
formulation: >-
  Различать бизнес-время и время регистрации: события и сведения моделируются с указанием той оси времени, к которой они относятся.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в охват модели входят история либо временные данные
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Для событий и сведений указана ось времени (бизнес-время либо время регистрации); смешение осей отсутствует.
  procedure: null
  evidence: [модель, описания атрибутов времени]
sources:
  - {doc: "Стандарт 0.6, раздел 7.11 (практика применения)", clause: "7.11"}
based_on: []
relations:
  depends_on: ["LDM-006"]
  refines: []
  replaces: null
status: draft
