# Перенос (волна 3 Д7, Р-023): С03, 2.3; обязательство — мощность связи, уникальность — реляционная форма выражения (Р-010).
schema_version: 1
id: LDM-012
revision: 1
formulation: >-
  Для связи «один-к-одному» задать логическое ограничение уникальности ссылочного атрибута или набора атрибутов: на один экземпляр целевой сущности может ссылаться не более одного экземпляра ссылающейся. При отсутствии уникальности фиксируется фактическое состояние ссылочного атрибута с пометкой в описании связи.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Для каждой связи 1:1 задано ограничение уникальности ссылки либо зафиксировано его отсутствие с пометкой.
  procedure: null
  evidence: [паспорт модели, описания модели]
