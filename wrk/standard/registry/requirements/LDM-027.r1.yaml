# Перенос (Д3, Р-016): С03, этап 4 (LDM-027). Модальность НЕ повышается
# (ПВ-02; Р-010 п. 4; план 0.4 § 7.1). Поэтапное восстановление доменов —
# допуск 3.7 в conditions. Основа случая § 7.2 «атрибут без требуемого домена».
schema_version: 1
id: LDM-027
revision: 1
formulation: >-
  Повторно используемые логические типы атрибутов задавать доменами: имя,
  смысл, допустимые значения либо ограничения, формат, единица измерения;
  при повторном использовании типа атрибута указывать ссылку на домен.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - восстановление доменов источника в AS-IS выполняется поэтапно в согласованном охвате (3.7)
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Домены описаны (имя, смысл, ограничения, формат, единица); повторное
    использование логического типа сопровождается ссылкой на домен; различие
    физических типов разных систем не препятствует общему логическому домену.
  procedure: null
  evidence: [каталог доменов, словарь атрибутов]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 4 (LDM-027)"}
based_on: []
relations:
  depends_on:
    - LDM-023
  refines: []
  replaces: null
status: draft
