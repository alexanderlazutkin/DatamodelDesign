# Перенос (волна 2 Д7, Р-022): С02, 2.4.7; запретительный оборот — по таблице Б5.
schema_version: 1
id: CDM-028
revision: 1
formulation: >-
  Не представлять роль или состояние как самостоятельный тип объекта без обоснования; при отдельном выделении определить носителя, условия возникновения и прекращения, возможность одновременного совмещения. Действующие трактовки сохраняются с указанием контекста; спорные случаи отражаются как открытые вопросы.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Роли и состояния не выдаются за типы объектов без обоснования; выделенные роли/состояния имеют носителя, условия и совмещение; спорные случаи — в реестре вопросов.
  procedure: null
  evidence: [паспорт модели, описания модели]
