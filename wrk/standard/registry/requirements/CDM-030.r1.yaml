# Перенос (волна 2 Д7, Р-022): С02, 2.4.9; условная применимость — в conditions.
schema_version: 1
id: CDM-030
revision: 1
formulation: >-
  Если время или состояние влияет на смысл понятия, определить существенные состояния, события и периоды, а также различие между бизнес-объектом и его историческим представлением. Смысл дат не выводится исключительно из имён полей; действующие правила отделяются от фактического способа отражения истории.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - время или состояние влияет на смысл понятия
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Существенные состояния, события и периоды определены; исторические представления различены с объектами; трактовка дат подтверждена источниками, а не именами полей.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.4.9 (CDM-030)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
