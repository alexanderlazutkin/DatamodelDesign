# Перенос (Д3, Р-016): С02, 2.2.8 (CDM-011).
schema_version: 1
id: CDM-011
revision: 1
formulation: >-
  Установить для каждой сущности, что представляет экземпляр: самостоятельный
  объект, событие, состояние, версию, роль или агрегат за период. Разные
  уровни детализации не смешиваются без явного описания; использование одного
  термина для разных объектов сопровождается фиксацией различий и потребности
  разделения.
