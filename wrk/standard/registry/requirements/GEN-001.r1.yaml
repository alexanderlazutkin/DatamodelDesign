# Перенос (Д3, Р-016): объединение CDM-002 (С02, 2.1.2) + LDM-029 (С03, этап 1)
# в общее требование; судьба исходных ID — прил. Ф. Запретительные AS-IS-обороты —
# редакционная форма того же обязательства (Б5, прим. 3).
schema_version: 1
id: GEN-001
revision: 1
formulation: >-
  Документировать текущее состояние и целевые изменения раздельно: целевые
  изменения имеют основание, статус согласования и явно обозначенную область
  действия; действующие понятия, правила и структуры не заменяются желаемыми;
  предложения по унификации и развитию оформляются отдельно от текущего
  состояния.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [to-be, as-is]
  stage: [2]
conditions: []
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Целевые изменения выделены из текущего состояния; каждое имеет основание,
    статус согласования и область действия; подмена действующих понятий,
    правил и структур желаемыми отсутствует; предложения по развитию оформлены
    отдельно от текущего состояния.
  procedure: null
  evidence: [паспорт модели, перечень целевых изменений]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.1.2 (CDM-002)"}
  - {doc: "Требования к ЛМД (С03)", clause: "этап 1 (LDM-029)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: CDM-002
status: draft
