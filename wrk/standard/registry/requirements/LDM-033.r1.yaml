# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-033
revision: 1
formulation: >-
  При классификации сущности определить источник значений, смысл кодов, область их уникальности и правила актуальности; указать, является набор локальным, корпоративным или внешним. Нерасшифрованные коды отмечаются отдельно; один тип «строка» или «число» не раскрывает семантику кодированного атрибута.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждый используемый классификатор имеет источник, смысл кодов и правила актуальности; нерасшифрованные коды зарегистрированы.
  procedure: null
  evidence: [паспорт модели, описания модели]
