# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-008
revision: 1
formulation: >-
  При наличии соответствующего утверждённого термина указать ссылку на него для сущности, атрибута или домена; при отсутствии термина допускается локальное определение, для общеупотребимого бизнес-понятия рекомендуется инициировать включение в глоссарий. Принудительно связывать одинаково названные, но разные по смыслу понятия не следует.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждый элемент имеет ссылку на термин либо локальное определение; кандидаты на глоссарий инициированы; ложные связывания отсутствуют.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
