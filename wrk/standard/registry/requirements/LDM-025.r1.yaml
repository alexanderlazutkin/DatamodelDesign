# Перенос (волна 3 Д7, Р-023): С03, 2.4; межсистемные соответствия — 8.6.
schema_version: 1
id: LDM-025
revision: 1
formulation: >-
  Обозначать межсистемный ссылочный атрибут (кросс-системный линк): принадлежность к внешней сущности, систему-источник идентификатора, область его уникальности и правила сопоставления локальных и внешних идентификаторов. Допускается неполное описание внешней сущности, достаточное для понимания связи, с указанием границы ответственности.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: intermodel
  criterion: >-
    Каждый межсистемный линк обозначен с источником, областью уникальности и правилами сопоставления; внешняя зависимость не исчезает из модели.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
