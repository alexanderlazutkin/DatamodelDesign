# Перенос (Д3, Р-016): С02, 2.3.3 (CDM-014). Совпадение значений полей — не
# доказательство бизнес-связи; между двумя сущностями допустимо несколько
# связей (комментарий исходника — в критерий).
schema_version: 1
id: CDM-014
revision: 1
formulation: >-
  Для каждой связи описать самостоятельный бизнес-факт, участников и их роли;
  наименование или описание связи позволяет прочитать её как осмысленное
  утверждение. Совпадение значений полей не является достаточным
  доказательством бизнес-связи.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая связь охвата имеет описание бизнес-факта и ролей участников;
    связи читаются как осмысленные утверждения; связи, установленные только
    по совпадению значений, не выдаются за подтверждённые бизнес-связи.
  procedure: null
  evidence: [описания связей, диаграммы]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3.3 (CDM-014)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
