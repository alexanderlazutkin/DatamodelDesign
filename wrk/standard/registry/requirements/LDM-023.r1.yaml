# Перенос (Д3, Р-016): С03, этап 4 (LDM-023). AS-IS-послабление (первоначальная
# фиксация физического типа источника и предварительного логического типа) —
# допуск 3.7 в conditions, без снижения модальности (Проба 3.2). Снятие
# предварительности к утверждению управляется требованием статуса
# достоверности (LDM-031/LDM-039).
schema_version: 1
id: LDM-023
revision: 1
formulation: >-
  Определить тип данных каждого атрибута согласованного охвата и существенные
  ограничения его значений; при необходимости указать единицу измерения,
  точность, масштаб, валюту, часовой пояс, формат или набор допустимых
  значений без привязки к конкретной СУБД.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в AS-IS допускается первоначальная фиксация физического типа как сведения об источнике и предварительного логического типа со статусом допущения и планом уточнения (3.7)
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждый атрибут охвата имеет зафиксированный логический тип данных
    (окончательный либо предварительный со статусом допущения и планом
    уточнения) и существенные ограничения значений по мере установления;
    единицы, точность и прочие характеристики указаны при необходимости.
  procedure: null
  evidence: [словарь атрибутов]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 4 (LDM-023)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
