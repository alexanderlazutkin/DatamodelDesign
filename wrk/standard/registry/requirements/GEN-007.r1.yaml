# Перенос (Д3, Р-016): новое общее требование из тезиса 1.8 С01 v0.8
# (полнота и корректность матрицы применения требований AS-IS).
schema_version: 1
id: GEN-007
revision: 1
formulation: >-
  Вести матрицу применения требований AS-IS: для каждого требования
  заявленного выпуска — способ применения (без изменения, адаптировано,
  не применяется); при адаптации — ссылка на адаптированное либо специальное
  требование AS-IS, обоснование различия и критерий проверки в AS-IS.
  Режимные связи ведутся только типами «применяется без изменения» и
  «адаптирует для режима»; замены для режимных связей не применяются.
  Применение рассогласованных выпусков стандарта и регламента AS-IS
  не допускается.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [as-is]
  stage: [7]
conditions: []
exception_allowed: false
verify:
  kind: formal
  criterion: >-
    Для каждого требования заявленного выпуска имеется строка матрицы;
    способ применения и тип связи соответствуют допустимым парам; для
    адаптированных — ссылка и обоснование присутствуют; выпуски стандарта
    и регламента согласованы манифестом.
  procedure: null
  evidence: [матрица применения AS-IS, манифест выпуска]
sources:
  - {doc: "Структура стандарта (С01 v0.8)", clause: "1.8"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
