# Перенос (волна 2 Д7, Р-022): С02, 2.6.2; AS-IS-дополнение — по прецеденту CDM-001 (одна запись, mode both).
schema_version: 1
id: CDM-040
revision: 1
formulation: >-
  Предоставить редактируемую модель, читаемые диаграммы, словарь сущностей, описания связей и существенных правил либо ссылки на их управляемые описания; для включённых характеристик — определения. При AS-IS дополнительно предоставляются сведения об источниках, охвате, неподтверждённых трактовках и выявленных расхождениях.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [7]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Комплект содержит перечисленные компоненты либо ссылки на управляемые описания; для AS-IS — сведения об источниках и расхождениях; диаграммы без определений недостаточны.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.6.2 (CDM-040)"}
based_on: []
relations:
