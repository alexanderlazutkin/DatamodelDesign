# Перенос (Д3, Р-016): С03, этап 3 (LDM-009). Применимость — все профили ЛМД
# (Р-010 по ПВ-02): обязательство общее; выбор первичного ключа (PK) —
# реляционная форма выражения по умолчанию, профильные формы — прил. Б.
schema_version: 1
id: LDM-009
revision: 1
formulation: >-
  Определить основной идентификатор сущности и известные альтернативные
  идентификаторы. Идентификатор однозначно различает экземпляры в заданной
  области и не содержит избыточных атрибутов; для составного идентификатора
  уникальна комбинация атрибутов, каждый атрибут основного идентификатора
  обязателен.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Для каждой сущности охвата задан основной идентификатор и перечислены
    известные альтернативные; однозначность в области различения подтверждается
    описанием; избыточные атрибуты в основном идентификаторе отсутствуют;
    для составного идентификатора указана обязательность всех компонент.
  procedure: null
  evidence: [словарь сущностей, описания идентификаторов]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 3 (LDM-009)"}
based_on: []
relations:
  depends_on:
    - CDM-012
  refines: []
  replaces: null
status: draft
