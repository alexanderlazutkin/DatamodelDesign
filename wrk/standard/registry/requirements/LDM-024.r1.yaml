# Перенос (волна 3 Д7, Р-023): С03, 2.4; условная применимость — в conditions.
schema_version: 1
id: LDM-024
revision: 1
formulation: >-
  Включить бизнес-значимые производные атрибуты; для включённых указать правило вычисления либо ссылку на него, входные данные, существенные условия расчёта и временной контекст. Если формула недоступна или не подтверждена, указываются источник результата и статус уточнения; полный разбор всех вычислений приложения не требуется.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в модель включены производные атрибуты
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждый производный атрибут имеет правило/ссылку, входные данные и контекст либо зарегистрированный статус уточнения.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "LDM-024 (LDM-024)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
