# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-005
revision: 1
formulation: >-
  Обеспечить уникальность имени сущности в установленном пространстве имён, имени атрибута — внутри сущности. Связи однозначно различаются по участникам, ролям и при необходимости имени; повторение имён атрибутов в разных сущностях допускается. Имена отражают смысл объекта; допускаются исходные имена и нерасшифрованные сокращения с пометкой, неоднозначность устраняется квалифицированными именами и идентификаторами объектов.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Имена сущностей уникальны в пространстве имён, атрибутов — внутри сущности; связи различимы; унаследованные и временные имена помечены.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
