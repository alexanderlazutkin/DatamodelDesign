# Перенос (волна 2 Д7, Р-022): С02, 2.4.6; условная применимость — в conditions.
schema_version: 1
id: CDM-027
revision: 1
formulation: >-
  При использовании подтипов определить критерии принадлежности, допустимость пересечения и полноту классификации; подтип представляет разновидность того же общего понятия. Похожие структуры хранения не считаются доказательством отношения «вид — род».
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - в модели используются подтипы
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для каждого обобщения определены критерий принадлежности, пересечение и полнота; подтипы — разновидности общего понятия, а не результат сходства структур.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.4.6 (CDM-027)"}
based_on: []
relations:
