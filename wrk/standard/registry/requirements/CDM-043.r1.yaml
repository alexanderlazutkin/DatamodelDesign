# Перенос (Д3, Р-016): новое адаптированное AS-IS-требование пары CDM-037
# (правая ветвь Б1, по образцу LDM-031/LDM-039 — Проба 3.3; ID назначен
# решением Р-016). Различие обязательств: в AS-IS нет обязанности устранения
# неопределённостей к утверждению — установлена обязанность маркировки.
schema_version: 1
id: CDM-043
revision: 1
formulation: >-
  Для определений, связей и спорных правил указывать статус: подтверждено,
  предположение, не установлено, противоречие источников; для подтверждённого
  фиксировать основание и дату либо версию.
modality: required
applies_to:
  level: [CDM]
  mode: [as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Определения, связи и спорные правила охвата имеют статус достоверности
    из перечня; подтверждённые — с основанием и датой либо версией; элементы
    со статусами «предположение», «не установлено», «противоречие источников»
    не выдаются за подтверждённые.
  procedure: null
  evidence: [карточки утверждений, описания источников]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.5.5 (CDM-037), описание AS-IS"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
