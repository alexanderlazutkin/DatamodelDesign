# Перенос (Д3, Р-016): С03, этап 3 (LDM-011). По решению Р-010 (ПВ-02, таблица
# v0.3): одно обязательство описания связи + ссылочная реализация как форма
# выражения; FK — без утверждения о физической реализации. Способ идентификации
# раскрывается в ЛМД, бизнес-смысл зависимости — в КМД (CDM-014).
schema_version: 1
id: LDM-011
revision: 1
formulation: >-
  Для каждой связи ЛМД описать смысл и роль; для ссылочных атрибутов указать
  основной либо альтернативный уникальный идентификатор цели. Связь, в которой
  идентификатор родителя входит в составной идентификатор потомка, обозначается
  как идентифицирующая (наследование идентификатора) и не смешивается
  с зависимостью существования.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждая связь охвата имеет смысл и роль; для ссылочных атрибутов указан
    целевой идентификатор (основной либо альтернативный); идентифицирующие
    связи обозначены отдельным типом и не отождествляются с зависимостью
    существования.
  procedure: null
  evidence: [описания связей, диаграммы]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 3 (LDM-011)"}
based_on: []
relations:
  depends_on:
    - LDM-009
  refines: []
  replaces: null
status: approved
