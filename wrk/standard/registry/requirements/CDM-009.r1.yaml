# Перенос (волна 2 Д7, Р-022): С02, 2.2.6; запретительный оборот — по таблице Б5.
schema_version: 1
id: CDM-009
revision: 1
formulation: >-
  Обеспечить уникальность имени сущности в установленном пространстве имён; одинаковые слова с разным смыслом разделять определениями и квалификаторами контекста; синонимы связывать с соответствующим понятием. Существующие различия трактовок сохраняются с указанием областей применения; неподтверждённое объединение понятий не допускается.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Имена сущностей уникальны в пространстве имён; одинаковые слова с разным смыслом разделены квалификаторами и определениями; известные синонимы связаны с понятиями; объединение понятий имеет подтверждение.
  procedure: null
  evidence: [паспорт модели, описания модели]
