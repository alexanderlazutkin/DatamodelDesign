# Перенос (волна 2 Д7, Р-022): С02, 2.4.1.
schema_version: 1
id: CDM-022
revision: 1
formulation: >-
  Включать характеристики, необходимые для понимания сущности, различения понятий или выражения существенных правил; полный атрибутивный состав не требуется. Допускается первоначальная модель без характеристик, если согласованный смысл раскрывается определениями и связями.
modality: allowed
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Включённые характеристики обоснованы пониманием, различением или правилами; перенос полей источника сам по себе не порождает характеристик.
  procedure: null
  evidence: [паспорт модели, описания модели]
