# Перенос (волна 3 Д7, Р-023): С03, 2.3; согласовано с 9.6 (характер связей и механизмы контроля).
schema_version: 1
id: LDM-019
revision: 1
formulation: >-
  Для каждой связи указывать способ обеспечения ссылочной целостности: декларативное ограничение базы данных, контроль приложения либо логическое правило без автоматического контроля. Различаются физически объявленные связи, связи, реализованные приложением, и предполагаемые связи; известные нарушения ссылочной целостности и отсутствие контроля фиксируются; добавление механизмов контроля в действующую систему для завершения документирования не требуется.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для каждой связи указан способ обеспечения целостности; нарушения и отсутствие контроля зафиксированы; механизм не выдаётся за доказательство контроля.
  procedure: null
  evidence: [паспорт модели, описания модели]
