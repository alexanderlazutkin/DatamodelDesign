# Перенос (Д3, Р-016): новое общее требование из тезисов 11.6 и 11.8 С01 v0.8
# (состав публикуемого комплекта; переносимость; граница модели и представления).
schema_version: 1
id: GEN-006
revision: 1
formulation: >-
  Обеспечивать корректность комплекта при публикации и переносе:
  публикуемый комплект содержит редактируемую модель, диаграммы, словари,
  правила, соответствия и результаты согласования; состав и согласованность
  проверяются по манифесту выпуска; комплект с дефектом не публикуется.
  При переносе сохраняются идентификаторы, определения, связи и метаданные;
  потеря обязательных метаданных при переносе авторитетной модели не
  допускается, перенесённая копия с известной потерей не используется как
  авторитетная; ошибка в экспорте или производном представлении не является
  автоматически ошибкой авторитетной модели.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [to-be, as-is]
  stage: [7]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Состав опубликованного комплекта соответствует манифесту выпуска;
    комплект с выявленным дефектом не опубликован либо публикация отменена;
    при переносе обязательные метаданные сохранены либо копия не используется
    как авторитетная; ошибки экспорта не приписаны авторитетной модели
    без её проверки.
  procedure: null
  evidence: [манифест выпуска, протокол проверки согласованности]
sources:
  - {doc: "Структура стандарта (С01 v0.8)", clause: "11.6, 11.8"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
