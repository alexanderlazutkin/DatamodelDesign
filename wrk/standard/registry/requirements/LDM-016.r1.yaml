# Перенос (волна 3 Д7, Р-023): С03, 2.3.
schema_version: 1
id: LDM-016
revision: 1
formulation: >-
  Циклические отношения между сущностями не используются по умолчанию, но допустимы с пояснением; требование не распространяется на отношение «родитель—потомок». Выявленные циклы анализируются на смысловую непротиворечивость, избыточность и выполнимость операций; для обязательных взаимных зависимостей определяется способ поддержания целостности; устранение циклов действующей системы для приёмки AS-IS не требуется.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждый цикл имеет пояснение и анализ; способ поддержания целостности определён; история циклов документирована.
  procedure: null
  evidence: [паспорт модели, описания модели]
