# Перенос (Д3, Р-016): С03, этап 3 (LDM-013). Наблюдаемая кардинальность
# по данным не считается автоматически бизнес-правилом. Основа случая § 7.2
# «изменение бизнес-ключа» (вместе с CDM-012, CDM-013, LDM-009).
schema_version: 1
id: LDM-013
revision: 1
formulation: >-
  Для каждой связи указывать минимальную и максимальную кардинальность с обеих
  сторон, различая обязательное и необязательное участие каждой стороны;
  неизвестные либо предполагаемые кардинальности обозначаются явно
  в описании.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждая связь охвата имеет кардинальности с обеих сторон (установленные,
    неизвестные либо предполагаемые — с явной маркировкой); наблюдаемые
    по данным кардинальности не зафиксированы как бизнес-правила без
    подтверждения.
  procedure: null
  evidence: [описания связей, диаграммы]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 3 (LDM-013)"}
based_on: []
relations:
  depends_on:
    - LDM-011
  refines: []
  replaces: null
status: approved
