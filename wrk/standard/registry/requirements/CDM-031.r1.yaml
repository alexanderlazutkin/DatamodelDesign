# Перенос (волна 2 Д7, Р-022): С02, 2.4.10; условная применимость — в conditions.
schema_version: 1
id: CDM-031
revision: 1
formulation: >-
  Для включённого производного понятия или показателя определить бизнес-смысл, исходные понятия, существенные условия расчёта и временной контекст либо дать ссылку на согласованное правило. Если правило не установлено, указывается источник результата и статус уточнения; неизвестная методика не подменяется предполагаемой формулой.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - в модель включено производное понятие или показатель
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждое производное понятие имеет смысл, исходные понятия, условия расчёта и контекст либо ссылку на правило; отсутствующее правило зафиксировано вопросом, а не формулой.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.4.10 (CDM-031)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
