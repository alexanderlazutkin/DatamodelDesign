# Перенос (волна 2 Д7, Р-022): С02, 2.3.7.
schema_version: 1
id: CDM-018
revision: 1
formulation: >-
  Если участие в связи имеет самостоятельный бизнес-смысл, собственный жизненный цикл, повторяемые случаи или значимые характеристики, представить его как ассоциативную сущность либо эквивалентную конструкцию согласованной нотации; соответствующее понятие восстанавливается независимо от наличия отдельного объекта хранения.
