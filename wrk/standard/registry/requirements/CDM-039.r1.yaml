# Перенос (Д3, Р-016): С02, 2.6.1 (CDM-039). Основа случая § 7.2 «отозванная
# версия» вместе с GEN-005. Изменение физической схемы не всегда требует
# изменения КМД; изменение бизнес-смысла требует проверки влияния.
schema_version: 1
id: CDM-039
revision: 1
formulation: >-
  Хранить версии и историю изменений КМД; определить события пересмотра:
  изменение требований, процессов, нормативных правил, терминологии или границ
  доменов; при изменениях оценивать влияние на связанные модели.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [7, 8]
conditions: []
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    История изменений ведётся; события пересмотра определены; для каждого
    изменения зафиксирована оценка влияния на связанные модели либо явное
    указание на её отсутствие; указана дата или период достоверности описания.
  procedure: null
  evidence: [история версий, оценки влияния]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.6.1 (CDM-039)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
