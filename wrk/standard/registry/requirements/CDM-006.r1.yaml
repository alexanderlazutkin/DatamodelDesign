# Перенос (волна 2 Д7, Р-022): С02, 2.2.3.
schema_version: 1
id: CDM-006
revision: 1
formulation: >-
  Описывать бизнес-понятия независимо от конкретных приложений, СУБД и структур хранения; системы указываются как контекст или источники и не определяют состав сущностей автоматически. Технический объект не объявляется концептуальной сущностью без объяснения его смысла в предметной области.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Восстановленная бизнес-семантика отделена от технической структуры источников; каждый технический объект, включённый в модель, имеет объяснённый смысл в предметной области.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
