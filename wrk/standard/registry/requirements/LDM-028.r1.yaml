# Перенос (Д3, Р-016): С03, этап 1 (LDM-028). Норма о слиянии одноимённых
# объектов разных систем (комментарий исходника) — в критерии: только при
# подтверждённом соответствии. AS-IS-реквизиты обследования — в критерии матрицы.
schema_version: 1
id: LDM-028
revision: 1
formulation: >-
  Указывать в паспорте ЛМД назначение, систему либо домен, охват, исключения,
  вид модели, версию, статус и ответственного.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [2]
conditions: []
exception_allowed: false
verify:
  kind: documentary
  criterion: >-
    Паспорт ЛМД содержит все восемь реквизитов: назначение, система либо
    домен, охват, исключения, вид модели, версия, статус, ответственный;
    при охвате нескольких ИТ-истем каждая сущность атрибутирована
    системой-источником либо целевой системой; слияние одноимённых объектов
    разных систем выполнено только при подтверждённом соответствии.
  procedure: null
  evidence: [паспорт модели, словарь сущностей]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 1 (LDM-028)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
