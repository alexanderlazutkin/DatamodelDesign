# Перенос (волна 3 Д7, Р-023): С03, 2.2; условная применимость — в conditions.
schema_version: 1
id: LDM-034
revision: 1
formulation: >-
  При наличии подтипов определить критерии принадлежности, возможность пересечения, полноту классификации и наследование идентификаторов; для иерархий — допустимость нескольких родителей, корней и циклов в данных. Установленная семантика отделяется от предположений по структуре хранения; поэтапное восстановление правил допускается.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в модели используются подтипы либо иерархии
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Для каждого обобщения определены критерий, пересечение, полнота и наследование идентичности; предположения помечены.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "LDM-034 (LDM-034)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
