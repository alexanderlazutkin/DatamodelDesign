# Перенос (Д3, Р-016): С02, 2.5.3 (CDM-035). Условная применимость «при наличии
# ЛМД» — в conditions. Соответствие не означает взаимно однозначное отображение;
# технические элементы ЛМД могут не иметь аналога в КМД (комментарий исходника).
schema_version: 1
id: CDM-035
revision: 1
formulation: >-
  Поддерживать смысловые соответствия между КМД и соответствующей ЛМД;
  несоответствия и ещё не сопоставленные области учитывать явно. Отсутствие
  ЛМД не блокирует утверждение КМД.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [4]
conditions:
  - соответствующая ЛМД существует
exception_allowed: true
verify:
  kind: intermodel
  criterion: >-
    Смысловые соответствия между сущностями КМД и ЛМД заданы; тип соответствия
    (в том числе «один ко многим») указан явно; несопоставленные области и
    несоответствия перечислены с причиной.
  procedure: null
  evidence: [таблица соответствий КМД — ЛМД]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.5.3 (CDM-035)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
