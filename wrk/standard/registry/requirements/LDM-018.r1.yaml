# Перенос (волна 3 Д7, Р-023): С03, 2.3; модальность не повышается (Р-010 п. 4).
schema_version: 1
id: LDM-018
revision: 1
formulation: >-
  Обязательность участия в связи описывается явно: ссылочный атрибут имеет обязательность заполнения по умолчанию; необязательные связи допустимы с пояснением; для составных ссылок описывается допустимость частичного отсутствия. Бизнес-обязательность не выводится автоматически из наличия или отсутствия технических ограничений источника; расхождения документируются.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
