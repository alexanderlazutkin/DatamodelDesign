# Перенос (волна 3 Д7, Р-023): С03, 2.3; по ПВ-02 (Р-010) — явность M:M обязательство, ассоциативная сущность — форма выражения.
schema_version: 1
id: LDM-015
revision: 1
formulation: >-
  Определить отношение «многие-ко-многим» явно: участники, смысл и атрибуты факта связи. Форма выражения по умолчанию — ассоциативная (промежуточная) сущность, в которой размещаются атрибуты связи; профильные формы выражения — прил. Б. Ассоциативная сущность может быть восстановлена как логический объект и при отсутствии отдельной таблицы хранения.
