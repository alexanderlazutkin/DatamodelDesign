# Перенос (Д3, Р-016): С02, 2.4.11 (CDM-032). ИОД включено в объём пилота
# (Р-010 по ПВ-08). Условная применимость — в conditions; поэтапное уточнение
# в AS-IS — в критерии матрицы. КМД не заменяет атрибутивную разметку ЛМД (LDM-026).
schema_version: 1
id: CDM-032
revision: 1
formulation: >-
  Обозначить понятия и, при необходимости, характеристики, связанные
  с чувствительными данными (ИОД), со ссылкой на применимую корпоративную
  или нормативную классификацию. Неустановленная категория не означает
  общедоступность; примеры приводятся синтетические или обезличенные.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - в охват модели входят данные, подпадающие под корпоративную или нормативную классификацию ИОД
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Понятия с чувствительными данными обозначены со ссылкой на применимую
    классификацию; случай неустановленной категории маркирован явно и не
    трактуется как общедоступность; примеры чувствительных данных —
    синтетические или обезличенные.
  procedure: null
  evidence: [разметка ИОД модели, ссылка на классификацию]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.4.11 (CDM-032)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
