  kind: documentary
  criterion: >-
    Для восстановленной семантики и спорных правил указаны источник и статус;
    схемное ограничение, правило приложения и наблюдение в данных различаются.
  procedure: null
  evidence: [карточки утверждений, описания источников]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "2.5 (LDM-031), описание AS-IS"}
