# Перенос (Д3, Р-016): новое адаптированное AS-IS-требование пары LDM-031
# (правая ветвь Б1, Проба 3.3; условный ID испытательного примера Д2 назначен
# реальным решением Р-016). Различие обязательств: в AS-IS нет обязанности
# устранения неопределённостей к утверждению — установлена обязанность
# маркировки источника и статуса.
schema_version: 1
id: LDM-039
revision: 1
formulation: >-
  Маркировать источник и статус восстановленной семантики: подтверждено,
  предположение, не установлено. Различать наличие ограничения в схеме,
  правило приложения и наблюдения в данных.
modality: required
applies_to:
  level: [LDM]
  mode: [as-is]
  stage: [5]
conditions: []
exception_allowed: true
