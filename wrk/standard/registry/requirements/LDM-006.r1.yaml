# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-006
revision: 1
formulation: >-
  Определить для каждой сущности бизнес-смысл, гранулярность и то, что представляет один её экземпляр: объект, событие, состояние, версию или агрегат за период. При хранении истории описать связь бизнес-идентичности и идентификатора версии, периоды действия и правила пересечения интервалов. Неподтверждённая расшифровка не выдаётся за достоверную; неизвестный смысл временных полей фиксируется, не выводясь из названий.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая сущность имеет смысл, гранулярность и экземпляр; история версий описана (идентичность ↔ версия, периоды, пересечения); трактовки дат подтверждены источниками.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "LDM-006 (LDM-006)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
