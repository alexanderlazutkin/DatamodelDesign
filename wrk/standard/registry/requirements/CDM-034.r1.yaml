  criterion: >-
    Значимые понятия и правила охвата имеют ссылки на основания; основания
    идентифицируют документ и редакцию либо решение; связь «основание —
    элементы» допускает один источник для нескольких элементов.
  procedure: null
  evidence: [связи с основаниями, реестр источников]
sources:
