# Перенос (Д3, Р-016): С02, 2.5.2 (CDM-034). Один источник может подтверждать
# несколько элементов — отдельный файл на каждый элемент не требуется
# (комментарий исходника — в критерий).
schema_version: 1
id: CDM-034
revision: 1
formulation: >-
  Поддерживать связи значимых понятий и правил с требованиями, процессами,
  нормативными документами или согласованными решениями.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [4]
conditions: []
