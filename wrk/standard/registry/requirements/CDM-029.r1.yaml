# Перенос (волна 2 Д7, Р-022): С02, 2.4.8; условная применимость — в conditions.
schema_version: 1
id: CDM-029
revision: 1
formulation: >-
  При наличии иерархии определить смысл отношения, возможность нескольких родителей, наличие корней, допустимость циклов и существенную зависимость от времени. Выявленные отклонения документируются отдельно от установленных правил.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - в модели имеется иерархия или рекурсивное отношение
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая иерархия имеет определённые смысл, число родителей, корни, допустимость циклов и временную зависимость; отклонения зафиксированы отдельно.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.4.8 (CDM-029)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
