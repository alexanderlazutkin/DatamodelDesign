# Перенос (Д3, Р-016): С03, этап 4 (LDM-032). Модальность НЕ повышается
# (Р-010 п. 4). Предложения по устранению аномалий в AS-IS ведутся отдельно —
# в критерии матрицы AS-IS (случай § 7.2 «недостатки нормализации»).
schema_version: 1
id: LDM-032
revision: 1
formulation: >-
  Обосновывать отклонения от нормализации при наличии избыточности
  (денормализации и дублирования) данных с использованием нормальных форм
  и профиля нагрузки; определять правила согласованности при избыточности.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions:
  - в модели имеется избыточность данных
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Каждый случай избыточности охвата обоснован нормальными формами и профилем
    нагрузки либо маркирован как необоснованный; правила согласованности копий
    определены.
  procedure: null
  evidence: [описания сущностей, обоснования избыточности]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 4 (LDM-032)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
