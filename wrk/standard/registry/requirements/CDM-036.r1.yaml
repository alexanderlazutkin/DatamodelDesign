# Перенос (волна 2 Д7, Р-022): С02, 2.5.4; размещение — 8.6 по v0.8 (междоменные соответствия).
schema_version: 1
id: CDM-036
revision: 1
formulation: >-
  Для общих понятий определить границы использования, владельца определения и допустимые контекстные различия; существенные противоречия разрешить до утверждения затрагиваемого решения либо оформить как согласованные ограничения. Различающиеся трактовки фиксируются с источниками; единое корпоративное определение не объявляется без необходимого согласования.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [4]
conditions: []
exception_allowed: true
verify:
  kind: expert
  criterion: >-
    Для каждого общего понятия указаны владелец определения и контекстные различия; существенные противоречия разрешены либо оформлены ограничениями; объявление единого определения подтверждено согласованием.
  procedure: null
  evidence: [паспорт модели, описания модели]
