# Перенос (Д3, Р-016): объединение CDM-041 (С02, 2.6.3) + LDM-038 (С03, этап 6)
# в общее требование; судьба исходных ID — прил. Ф. Ведение с начала работ задаётся
# контрольной процедурой (прил. Ж), а не применимостью (Б2, п. 1.3 правило 4).
schema_version: 1
id: GEN-002
revision: 1
formulation: >-
  Вести реестр вопросов, отклонений и противоречий модели. Для исключений из
  требований указывать основание, влияние, ответственного, согласовывающего
  и условия пересмотра; исключение действует в пределах обозначенных области,
  срока и полномочий согласования. Категории открытых вопросов учитывать
  раздельно: пробелы документации, ограничения обследования, конфликтующие
  определения, расхождения правил и практики, недостатки реализации,
  предложения по развитию.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [to-be, as-is]
  stage: [7]
conditions: []
exception_allowed: true
verify:
  kind: documentary
  criterion: >-
    Реестр ведётся; перечисленные категории учтены раздельно; каждая запись
    об исключении содержит основание, влияние, ответственного, согласовывающего
    и условия пересмотра; исключения не выходят за пределы обозначенных
    области, срока и полномочий.
  procedure: null
  evidence: [реестр вопросов, записи исключений]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.6.3 (CDM-041)"}
  - {doc: "Требования к ЛМД (С03)", clause: "этап 6 (LDM-038)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: CDM-041
status: draft
