# Перенос (Д3, Р-016): С03, этап 5 (LDM-030). Условная применимость части
# соответствий («при наличии КМД») — в conditions. Восстановление логических
# сущностей из нескольких физических структур и обратно — в критерии.
schema_version: 1
id: LDM-030
revision: 1
formulation: >-
  Поддерживать прослеживаемость элементов ЛМД: смысловые соответствия с КМД
  и связи с подтверждающими источниками; несоответствия и неотображённые
  объекты учитывать с причиной.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [6]
conditions:
  - для соответствий с КМД требуется наличие соответствующей КМД
exception_allowed: true
verify:
  kind: intermodel
  criterion: >-
    Элементы ЛМД сопоставлены с подтверждающими источниками; соответствия
    с КМД заданы при её наличии; случаи «несколько физических структур —
    одна логическая сущность» и обратные раскрыты явно; неотображённые
    объекты перечислены с причиной.
  procedure: null
  evidence: [таблица соответствий, реестр источников]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "этап 5 (LDM-030)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
