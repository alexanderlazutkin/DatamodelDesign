# Перенос (волна 3 Д7, Р-023): С03, 2.4; модальность не повышается (Р-010 п. 4, Р-016).
schema_version: 1
id: LDM-021
revision: 1
formulation: >-
  Явно указывать декларативные ограничения (уникальность, диапазоны значений, условия) на уровне модели, в том числе если ограничения реализуются программно; возможные механизмы физической реализации указываются как варианты, а не как единственная форма правила. Отражаются ограничения, выявленные в пределах согласованного обследования; для неизученных областей указывается, что полнота правил не подтверждена.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Выявленные ограничения зафиксированы с источниками; механизмы реализации не смешиваются с правилом; неполнота указана явно.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
