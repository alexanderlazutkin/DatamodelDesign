# Перенос (волна 2 Д7, Р-022): С02, 2.3.8.
schema_version: 1
id: CDM-019
revision: 1
formulation: >-
  При наличии зависимости определить, может ли объект существовать независимо от другого объекта и различается ли он только в его контексте. Если идентичность понятия задаётся через связь с другим понятием, обозначать связь как идентифицирующую в принятой нотации, не сводя концептуальную идентичность к первичным и внешним ключам и составным ключам. Зависимость существования не смешивается с обязательным участием в обычной связи; бизнес-смысл зависимости не выводится только из каскадного удаления или составного ключа источника.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для зависимых понятий определены независимость существования и контекст идентичности; идентифицирующие связи обозначены в нотации; механизм ключей источника не принят за доказательство бизнес-зависимости.
  procedure: null
  evidence: [паспорт модели, описания модели]
