# Перенос (волна 2 Д7, Р-022): С02, 2.2.4.
schema_version: 1
id: CDM-007
revision: 1
formulation: >-
  При наличии утверждённого термина указать ссылку на него; при отсутствии использовать локальное определение со статусом согласования. Расхождения с глоссарием разрешить либо оформить как согласованное контекстное отличие; отсутствие глоссария не блокирует восстановление КМД.
