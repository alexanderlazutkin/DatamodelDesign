# Перенос (волна 2 Д7, Р-022): С02, 2.5.1; этапы по Б2 (основной 4, доп. 6).
schema_version: 1
id: CDM-033
revision: 1
formulation: >-
  При значительном объёме разделять модель на обзорное представление и согласованные представления отдельных областей; общие элементы имеют единую идентичность в репозитории. Разные диаграммы — представления согласованной модели, а не независимые копии понятий.
