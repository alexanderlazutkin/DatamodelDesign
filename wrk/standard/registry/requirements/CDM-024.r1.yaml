# Перенос (волна 2 Д7, Р-022): С02, 2.4.3.
schema_version: 1
id: CDM-024
revision: 1
formulation: >-
  Если наличие характеристики существенно для бизнес-правил, указать, когда она должна быть известна или применима; при необходимости различать «неизвестно», «не применимо» и «ещё не определено». Установленная бизнес-обязательность отделяется от заполненности источников и технических ограничений.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для существенных характеристик указана обязательность и различены «неизвестно / не применимо / ещё не определено»; бизнес-обязательность не подменена заполненностью источников.
  procedure: null
  evidence: [паспорт модели, описания модели]
