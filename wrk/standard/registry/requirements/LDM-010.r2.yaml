# Перенос (волна 3 Д7, Р-023): С03, 2.3; модальность не повышается (Р-010 п. 4).
# Редакция 2 (Р-054, серия библиоаудита — review/01 К-3): дополнены критерии выбора идентификатора
# (устойчивость, существование значения при создании, минимальная длина, «factless», документирование
# генерации суррогата); модальность не меняется (recommended), обязательства расширяются методически.
schema_version: 1
id: LDM-010
revision: 2
formulation: >-
  Выбирать простой идентификатор по умолчанию; при выборе основного идентификатора учитываются: устойчивость (значение не меняется и не становится неопределённым в течение жизни экземпляра), существование значения в момент создания экземпляра, минимальная длина и отсутствие встроенных смыслов в частях значения («factless»); способ генерации значений суррогатного идентификатора документируется. Составные идентификаторы допускаются с пояснением (семантика, устойчивость, область уникальности, производительность). Существующий составной идентификатор отражается без требования замены; суррогатный идентификатор — вариант простого; предложения по изменению идентификации оформляются отдельно от AS-IS.
modality: recommended
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Выбор простого/составного идентификатора обоснован; критерии выбора применены (устойчивость, существование значения при создании, минимальная длина, отсутствие встроенных смыслов; для суррогатного — документированная генерация); для AS-IS существующая идентификация документирована без обязанности замены.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "LDM-010 (LDM-010)"}
  - {doc: "Серия библиоаудита (Р-054)", clause: "review/01, К-3"}
based_on: []
relations:
