# Перенос (волна 2 Д7, Р-022): С02, 2.3.10; запретительный оборот — по таблице Б5.
schema_version: 1
id: CDM-021
revision: 1
formulation: >-
  Явно обозначать связи с понятиями за границами модели: указывать внешний домен и смысл соответствия — тот же объект, роль объекта, классификация или иная связь; отражать степень подтверждения соответствий. Полное описание внешнего домена не требуется; одноимённые объекты разных систем или доменов автоматически тождественными не считаются.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая связь за границами модели имеет указание внешнего домена и смысла соответствия; степень подтверждения отражена; тождество одноимённых объектов не заявлено без подтверждения.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3.10 (CDM-021)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
