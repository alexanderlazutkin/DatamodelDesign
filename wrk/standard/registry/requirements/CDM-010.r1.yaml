# Перенос (Д3, Р-016): С02, 2.2.7 (CDM-010). AS-IS-допуск рабочих определений
# с источником и статусом подтверждения — в критерии матрицы AS-IS.
schema_version: 1
id: CDM-010
revision: 1
formulation: >-
  Для каждой сущности определить бизнес-смысл, границы понятия, существенные
  отличия от смежных понятий и то, что представляет один экземпляр; определение
  не сводится к повторению имени.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая сущность охвата имеет определение, содержащее бизнес-смысл,
    границы понятия, отличия от смежных понятий и состав экземпляра;
    повторение имени без раскрытия смысла не принимается.
  procedure: null
  evidence: [словарь сущностей]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.2.7 (CDM-010)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
