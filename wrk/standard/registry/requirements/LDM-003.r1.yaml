# Перенос (волна 3 Д7, Р-023): С03, 2.2.
schema_version: 1
id: LDM-003
revision: 1
formulation: >-
  Обеспечить смысловое соответствие ЛМД утверждённой КМД в границах проектирования и прослеживаемость между их элементами. Допускается детализация концептуальной сущности в несколько логических, введение ассоциативных сущностей и иных конструкций, необходимых для раскрытия согласованных бизнес-правил; изменения бизнес-смысла согласуются с актуализацией КМД. Наличие утверждённой КМД не является предварительным условием восстановления: указывается статус КМД и основания восстановления ЛМД, сопоставление выполняется по мере формирования КМД.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: intermodel
  criterion: >-
    Соответствия ЛМД ↔ КМД зафиксированы (виды соответствий — 8.4); статус КМД и основания восстановления указаны; изменения смысла согласованы.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
