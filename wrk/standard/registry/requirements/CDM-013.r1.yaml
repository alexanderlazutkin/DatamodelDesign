# Перенос (Д3, Р-016): С02, 2.3.2 (CDM-013). Условная применимость — в conditions
# (Проба, прим. 2 к Б5). Технический ID записи — не универсальный идентификатор
# бизнес-объекта без подтверждения. Основа случая § 7.2 «изменение бизнес-ключа».
schema_version: 1
id: CDM-013
revision: 1
formulation: >-
  Для бизнес-идентификатора (номера, кода или иного обозначения), используемого
  для понимания понятия, определить назначение, область уникальности
  и существенные правила изменения и повторного использования. Технический
  идентификатор записи не считается универсальным идентификатором
  бизнес-объекта без подтверждения.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions:
  - понятие использует бизнес-идентификатор (номер, код или иное обозначение)
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для каждого используемого бизнес-идентификатора указаны назначение, область
    уникальности и правила изменения либо повторного использования; технические
    идентификаторы записей не выдаются за бизнес-идентификаторы без
    подтверждения.
  procedure: null
  evidence: [словарь сущностей, описания идентификаторов]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3.2 (CDM-013)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
