# Перенос (Д3, Р-016): С02, 2.3.4 (CDM-015). Формулировка переформулирована
# по образцу С01 3.10 (Проба 3.3): предметный факт отделён от выполнения
# требования к документированию. Обязательное участие не устанавливается
# «по умолчанию» — следует из бизнес-правила.
schema_version: 1
id: CDM-015
revision: 1
formulation: >-
  Для каждой связи зафиксировать минимальное и максимальное участие с обеих
  сторон; неустановленные ограничения обозначить явно; установленные правила,
  фактическая практика и наблюдения в данных различаются. Для связей более чем
  с двумя участниками ограничения определяются в контексте сочетаний остальных
  участников.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Каждая связь охвата имеет установленные кардинальности либо явную
    маркировку неустановленности с основаниями и зарегистрированным вопросом;
    категории «правило / практика / наблюдение» не смешиваются; обязательность
    участия следует из бизнес-правила.
  procedure: null
  evidence: [описания связей, диаграммы, реестр вопросов]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3.4 (CDM-015)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
