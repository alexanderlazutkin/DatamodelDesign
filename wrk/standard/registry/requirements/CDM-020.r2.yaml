# Перенос (волна 2 Д7, Р-022): С02, 2.3.9.
# Редакция 2 (Р-054, серия библиоаудита — review/01 К-4, review/12): дополнена проверка избыточных
# триад с учётом исключений; модальность не меняется (recommended).
schema_version: 1
id: CDM-020
revision: 2
formulation: >-
  Проверять, отражают ли циклические связи самостоятельные факты и объясняется ли изолированность сущностей границами модели; подтверждённые конструкции сохраняются, неустановленные связи и контекст фиксируются. Связь, смысл которой выводится из цепочки других связей (избыточная триада), проверяется на самостоятельный бизнес-факт: подтверждённая избыточная связь сохраняется с основанием, неподтверждённая — кандидат на исключение; не всякая триада избыточна, исключения фиксируются.
modality: recommended
applies_to:
  level: [CDM]
  mode: [to-be, as-is]
  stage: [3]
conditions: []
exception_allowed: true
verify:
  kind: structural
  criterion: >-
    Циклические связи проверены на самостоятельность факта; избыточные триады проверены с учётом исключений; изолированные сущности объяснены границами модели либо зарегистрированы как вопрос.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.3.9 (CDM-020)"}
  - {doc: "Серия библиоаудита (Р-054)", clause: "review/01 К-4; review/12"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
