# Перенос (волна 3 Д7, Р-023): С03, 2.4; NULL/NOT NULL — реляционная форма выражения обязательности (Р-010).
schema_version: 1
id: LDM-020
revision: 1
formulation: >-
  Для каждого атрибута явно указать, допускает ли он неопределённое значение или нет; атрибуты, необходимые для бизнес-логики, обязательны по умолчанию. При существенности различать «неизвестно», «не применимо», «не получено»; обязательность может зависеть от состояния. Бизнес-обязательность допускается обозначать как неподтверждённую; расхождения между схемой, данными и правилами фиксируются отдельно.
modality: required
applies_to:
  level: [LDM]
  mode: [to-be, as-is]
  stage: [5]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    Для каждого атрибута указана обязательность; существенные различения значений выполнены; расхождения зафиксированы.
  procedure: null
  evidence: [паспорт модели, описания модели]
sources:
  - {doc: "Требования к ЛМД (С03)", clause: "LDM-020 (LDM-020)"}
based_on: []
relations:
