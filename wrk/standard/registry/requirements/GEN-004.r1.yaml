# Перенос (Д3, Р-016): новое общее требование из тезиса 10.1 С01 v0.8
# (различение объектов проверки; свидетельства по прил. Г).
schema_version: 1
id: GEN-004
revision: 1
formulation: >-
  Различать объекты проверки: выполнение требований правил фиксируется
  записями результатов проверки, соблюдение бизнес-ограничений — свидетельствами.
  Свидетельство связывается с объектом подтверждения: утверждением,
  бизнес-правилом, элементом модели, процедурой или фактом выполнения
  организационного требования; записи результатов проверки могут ссылаться
  на свидетельства. Конкретные результаты проверок в формулировки требований
  не переносятся.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [to-be, as-is]
  stage: [6]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Для каждой записи результата проверки определён объект проверки; ссылки
    на свидетельства разрешаются; свидетельства связаны с объектами
    подтверждения и хранятся отдельно от формулировок требований.
  procedure: null
  evidence: [записи результатов проверки, свидетельства]
sources:
  - {doc: "Структура стандарта (С01 v0.8)", clause: "10.1"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
