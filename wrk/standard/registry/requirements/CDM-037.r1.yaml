# Перенос (Д3, Р-016): С02, 2.5.5 (CDM-037). Разделение по режимам (правая ветвь
# Б1, по образцу LDM-031 — Проба 3.3): TO-BE-ветка; адаптированное AS-IS-требование —
# CDM-043 (связь adapts_for_mode в матрице применения).
schema_version: 1
id: CDM-037
revision: 1
formulation: >-
  До окончательного утверждения устранить неопределённости, влияющие на смысл
  целевой модели, либо оформить согласованные исключения с оценкой влияния.
  Статус согласования модели не скрывает статус отдельных спорных элементов.
modality: required
applies_to:
  level: [CDM]
  mode: [to-be]
  stage: [4]
conditions: []
exception_allowed: true
verify:
  kind: semantic
  criterion: >-
    К моменту утверждения отсутствуют неустранённые неопределённости смысла
    без оформленных исключений (основание, влияние, ответственный,
    согласовывающий, условия пересмотра); спорные элементы не выдаются
    за согласованные.
  procedure: null
  evidence: [реестр вопросов, записи исключений, протокол согласования]
sources:
  - {doc: "Требования к КМД (С02)", clause: "2.5.5 (CDM-037)"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: approved
