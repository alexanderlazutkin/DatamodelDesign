# Перенос (Д3, Р-016): новое общее требование из тезиса 11.9 С01 v0.8
# (статусы версий; отозванная версия; неизменность утверждённой версии).
schema_version: 1
id: GEN-005
revision: 1
formulation: >-
  Управлять статусами версий модели: утверждённая версия остаётся неизменной,
  изменения ведутся в новой рабочей версии от утверждённой базы. Отозванная
  версия не используется как действующая; проверка, выполненная для отозванной
  версии, явно маркируется как историческая.
modality: required
applies_to:
  level: [CDM, LDM]
  mode: [to-be, as-is]
  stage: [7, 8]
conditions: []
exception_allowed: true
verify:
  kind: formal
  criterion: >-
    Каждая версия модели имеет статус из жизненного цикла (черновик, на
    согласовании, утверждена, заменена, отозвана, архив); утверждённые версии
    не изменяются; отозванные не используются как действующие; исторический
    характер проверок отозванных версий маркирован.
  procedure: null
  evidence: [история версий, манифест выпуска, записи проверок]
sources:
  - {doc: "Структура стандарта (С01 v0.8)", clause: "11.9"}
based_on: []
relations:
  depends_on: []
  refines: []
  replaces: null
status: draft
